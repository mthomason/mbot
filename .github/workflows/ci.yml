name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy Firebase config: Vite needs non-empty values to build the client.
  # No real credentials are used in CI.
  VITE_FIREBASE_API_KEY: test-api-key
  VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: test-project
  VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
  VITE_FIREBASE_MEASUREMENT_ID: G-TEST

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report dev-only advisories (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r ../requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Audit Python dependencies
        run: pip-audit -r ../requirements.txt

      - name: Startup smoke test
        env:
          OPENAI_API_KEY_MBOT: test-key
          GOOGLE_PROJECT_ID_MBOT: test-project
          AI_MODEL_CHAT_FAST: test-model
        run: |
          python -m uvicorn main:fastapi_app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/version | grep -q '"version"'

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"hi"}')
          test "$status" = "401"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit --no-document
          bundler-audit check --update

  ci-success:
    name: CI success
    if: always()
    needs: [frontend, e2e, backend, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
